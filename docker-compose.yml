version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/recipes
      RECIPES_JSON: /app_data/US_recipes.json
    volumes:
      - ./backend:/app
      - ./data:/app_data
    depends_on:
      - db
    ports:
      - "8000:8000"
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
